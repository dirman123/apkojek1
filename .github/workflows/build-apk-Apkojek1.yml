name: Build Apkojek1 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file repository
        uses: actions/checkout@v4

      - name: Gunakan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak Apkojek1.zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'Apkojek1*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "File Apkojek1.zip tidak ditemukan di root repository."
            exit 1
          fi
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project
          PROJECT_DIR="$(find android-project -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle tidak ditemukan setelah ZIP diekstrak."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project Android: $PROJECT_DIR"

      - name: Build APK debug
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Siapkan hasil APK
        shell: bash
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/Apkojek1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apkojek1-APK
          path: Apkojek1.apk
